name: Cleanup ugc/pending

on:
  schedule:
    - cron: "0 4 * * *" # täglich 04:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ugc/pending/**'
      - 'ugc/approved/**'
      - 'approved.json'

concurrency:
  group: ugc-publication
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          ref: main

      - name: Ensure directories exist
        run: mkdir -p ugc/pending ugc/approved

      - name: Delete approved pending files
        run: |
          find ugc/pending -type f | while read pending_file; do
            filename=$(basename "$pending_file")
            approved_file="ugc/approved/$filename"

            if [ -f "$approved_file" ]; then
              echo "Lösche: $pending_file (in approved vorhanden)"
              rm "$pending_file"
            fi
          done

      - name: Merge approved JSONs into approved.json
        run: |
          find ugc/approved -name "*.json" -type f \
            | sort \
            | xargs jq -s '.' \
            > approved.json
          echo "$(find ugc/approved -name "*.json" | wc -l) Dateien zusammengeführt."

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet HEAD; then
            echo "Keine Änderungen – nichts zu committen."
          else
            git add -A
            git commit -m "chore: remove approved files from ugc/pending, update approved.json [skip ci]"
            git push
          fi
      - name: Publish approved collection to PixReveal
        env:
          UGC_SYNC_SECRET: ${{ secrets.UGC_SYNC_SECRET }}
          UGC_SYNC_URL: ${{ vars.PIXREVEAL_UGC_SYNC_URL || 'https://www.pixreveal.com/api/user-art' }}
        run: |
          if [ -z "$UGC_SYNC_SECRET" ]; then
            echo "Set the UGC_SYNC_SECRET repository secret before publishing."
            exit 1
          fi
          revision=$(git rev-parse HEAD)
          jq -n --arg revision "$revision" '{revision: $revision}' > "$RUNNER_TEMP/ugc-sync.json"
          curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 45 \
            --request POST \
            --header "Authorization: Bearer $UGC_SYNC_SECRET" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/ugc-sync.json" \
            "$UGC_SYNC_URL"
